{% set name = "conda-oci-mirror" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/channel-mirrors/conda-oci-mirror/archive/v{{ version }}.tar.gz
  sha256: 957b13cacdea4064f8ecff3178829377f9f9db5ad57ae0684725cd0f01f31b0c


build:
  script: {{ PYTHON }} -m pip install . -vv
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - click
    - requests
    - oras-py 0.1.14
    - conda-package-handling
    - zstandard
    - packaging

test:
  imports:
    - conda_oci_mirror
    - conda_oci_mirror.mirror
    - conda_oci_mirror.repo
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - conda-oci --help

about:
  home: https://github.com/channel-mirrors/conda-oci-mirror
  summary: 'Tools to mirror conda packages to an OCI registry'
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - wolfv
